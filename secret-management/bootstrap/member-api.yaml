apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: member-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kenshin579/argocd-charts-sample
    path: secret-management/charts/member-api
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: member-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
