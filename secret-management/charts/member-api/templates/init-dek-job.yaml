# sync 마다 앱(wave 1)보다 먼저(wave 0) 실행된다. DEK 가 이미 있으면 건너뛴다.
# PreSync 는 SA(wave -1)보다도 먼저 돌아서 첫 sync 에 SA 를 못 찾으므로 Sync 단계 hook 을 wave 로 순서를 맞춘다.
# 이름을 고정하면 ArgoCD 가 끝난 hook Job 을 재사용하는 경우가 있어서, generateName 으로 sync 마다 새 Job 을 만든다
apiVersion: batch/v1
kind: Job
metadata:
  generateName: member-api-init-dek-
  labels:
    app.kubernetes.io/component: init-dek
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  # 끝난 Job 은 10분 뒤 지운다
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: init-dek
      annotations:
        # Job 은 Agent 없이 코드에서 Kubernetes auth 로 직접 로그인한다
        vault.hashicorp.com/agent-inject: "false"
    spec:
      serviceAccountName: {{ .Values.vault.migrationRole }}
      restartPolicy: Never
      containers:
        - name: init-dek
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init-dek"]
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.serviceAddr | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.vault.migrationRole | quote }}
