# 두 SA 모두 일반 리소스로 두고 가장 먼저(wave -1) 만든다.
# hook 으로 만들면 sync 마다 지웠다 다시 만들면서 Job·Pod 가 SA 를 못 찾는 순간이 생긴다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api-migration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
