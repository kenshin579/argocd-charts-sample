# 앱용. Pod 가 쓰는 동안 지워지면 token 이 무효가 되므로 일반 리소스로 둔다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api
---
# migration 용. PreSync Job 보다 먼저 있어야 하므로 hook 으로 만든다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
