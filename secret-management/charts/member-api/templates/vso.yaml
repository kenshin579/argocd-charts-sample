{{- if eq .Values.secretSource "vault" }}
# VSO 가 이 SA 의 token(TokenRequest)으로 Vault Kubernetes auth 에 로그인한다.
# VaultStaticSecret 과 같은 namespace 의 SA 여야 한다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vso.role }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  address: {{ .Values.vso.address }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: member-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vso.role }}
    serviceAccount: {{ .Values.vso.role }}
---
# Vault KV secret/member-api/config 를 SealedSecret 이 만들던 것과 같은 이름의 Secret 으로 동기화한다.
# Deployment 는 그대로 member-api-config 의 api-token 키를 읽는다
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: member-api-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: member-api
  type: kv-v2
  mount: secret
  path: member-api/config
  refreshAfter: {{ .Values.vso.refreshAfter }}
  destination:
    name: member-api-config
    create: true
    # 기존 Secret 을 넘겨받는다. ownerReference·label·annotation 을 VSO 것으로 바꾼다
    overwrite: true
  # 값이 바뀌면 Deployment 를 재시작해 새 env 를 읽게 한다(첫 동기화 때는 재시작하지 않는다)
  rolloutRestartTargets:
    - kind: Deployment
      name: member-api
{{- end }}
