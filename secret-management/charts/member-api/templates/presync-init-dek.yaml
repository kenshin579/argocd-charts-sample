# sync 마다 먼저 실행된다. DEK 가 이미 있으면 건너뛴다
apiVersion: batch/v1
kind: Job
metadata:
  name: member-api-init-dek
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        # Job 은 Agent 없이 코드에서 Kubernetes auth 로 직접 로그인한다
        vault.hashicorp.com/agent-inject: "false"
    spec:
      serviceAccountName: {{ .Values.vault.migrationRole }}
      restartPolicy: Never
      containers:
        - name: init-dek
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init-dek"]
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.serviceAddr | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.vault.migrationRole | quote }}
